[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Jikan4"
dynamic = ["version"]
description = 'A Python wrapper for an anime API, with Tenrai as the default backend'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Matheus Bessa", email = "mdabessa@gmail.com" },
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ['aiohttp', 'requests', 'pydantic']

[project.urls]
Documentation = "https://github.com/mdabessa/jikan4#readme"
Issues = "https://github.com/mdabessa/jikan4/issues"
Source = "https://github.com/mdabessa/jikan4"

[tool.hatch.version]
path = "jikan4/__version__.py"

[tool.hatch.envs.test]
dependencies = [
  "pytest",
  "pytest-asyncio",
]
[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12"]
